services:
  - type: web
    name: simple-ai-agent
    runtime: python
    rootDir: 01-localhost-vs-production/develop
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
